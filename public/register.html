<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — LocalStock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FBF6EA',
            paper2: '#F3ECDA',
            ink: '#1A2B27',
            teal: { DEFAULT: '#0F5257', dark: '#0A3B3F', light: '#DCEAE8' },
            marigold: { DEFAULT: '#E8A33D', dark: '#C97F1E' },
            rust: '#C1541C',
            stock: '#2F7D4F',
            low: '#C97F1E',
            off: '#9A3B3B',
          },
          fontFamily: {
            display: ['"Fraunces"', 'serif'],
            body: ['"Inter"', 'sans-serif'],
            mono: ['"Space Mono"', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #FBF6EA;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(232,163,61,0.18), transparent 40%),
        radial-gradient(circle at 88% 82%, rgba(15,82,87,0.14), transparent 42%);
    }

    .stripe-band {
      background-image: repeating-linear-gradient(
        45deg, #E8A33D, #E8A33D 18px, #0F5257 18px, #0F5257 36px
      );
    }

    .role-tab[data-active="true"] {
      background: #0F5257;
      color: #FBF6EA;
    }
    .role-tab[data-active="false"] {
      background: transparent;
      color: #1A2B27;
      opacity: .55;
    }

    .focus-ring:focus-visible { outline: 3px solid #C1541C; outline-offset: 2px; }
    input:focus { outline: none; }
    .rise { animation: rise .55s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }
    ::selection { background: #E8A33D; color: #1A2B27; }
  </style>
</head>
<body class="font-body text-ink antialiased min-h-screen flex flex-col">
  <div class="stripe-band h-1.5 w-full"></div>

  <header class="max-w-7xl mx-auto w-full px-5 md:px-8 py-6">
    <a href="/" class="inline-flex items-center gap-2 focus-ring rounded">
      <span class="w-9 h-9 rounded-full bg-teal text-paper flex items-center justify-center font-display font-bold text-lg">L</span>
      <span class="font-display font-bold text-xl tracking-tight text-teal-dark">LocalStock</span>
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center px-5 py-8">
    <div class="w-full max-w-md rise">
      <div class="bg-white rounded-3xl border border-teal/15 shadow-xl shadow-teal-dark/10 overflow-hidden">
        <div class="p-2 bg-paper2 flex gap-1" role="tablist" aria-label="Choose account type">
          <button type="button" data-role="customer" data-active="true" class="role-tab flex-1 text-sm font-semibold rounded-xl py-2.5 transition focus-ring" role="tab" aria-selected="true">Customer</button>
          <button type="button" data-role="retailer" data-active="false" class="role-tab flex-1 text-sm font-semibold rounded-xl py-2.5 transition focus-ring" role="tab" aria-selected="false">Retailer</button>
          <button type="button" data-role="admin" data-active="false" class="role-tab flex-1 text-sm font-semibold rounded-xl py-2.5 transition focus-ring" role="tab" aria-selected="false">Admin</button>
        </div>

        <div class="p-7 sm:p-8">
          <p class="font-mono text-xs font-bold text-rust tracking-wide mb-1">CREATE ACCOUNT</p>
          <h1 class="font-display font-semibold text-2xl mb-1">Welcome to LocalStock</h1>
          <p class="text-sm text-ink/60 mb-6">Create your account and start exploring local inventory.</p>

          <p id="register-error" class="hidden text-xs font-semibold text-off bg-off/10 border border-off/25 rounded-lg px-3 py-2 mb-4"></p>
          <p id="register-success" class="hidden text-xs font-semibold text-stock bg-stock/10 border border-stock/25 rounded-lg px-3 py-2 mb-4"></p>

          <form id="register-form" class="space-y-4">
            <div>
              <label for="name" class="block text-xs font-semibold text-ink/70 mb-1.5">Full name</label>
              <input id="name" type="text" required placeholder="Your name"
                class="w-full text-sm bg-paper2 border border-teal/15 rounded-xl px-4 py-3 placeholder:text-ink/35 focus:border-teal focus:bg-white transition focus-ring" />
            </div>

            <div>
              <label for="email" class="block text-xs font-semibold text-ink/70 mb-1.5">Email address</label>
              <input id="email" type="email" required placeholder="you@example.com"
                class="w-full text-sm bg-paper2 border border-teal/15 rounded-xl px-4 py-3 placeholder:text-ink/35 focus:border-teal focus:bg-white transition focus-ring" />
            </div>

            <div>
              <label for="password" class="block text-xs font-semibold text-ink/70 mb-1.5">Password</label>
              <input id="password" type="password" required placeholder="At least 8 characters"
                class="w-full text-sm bg-paper2 border border-teal/15 rounded-xl px-4 py-3 placeholder:text-ink/35 focus:border-teal focus:bg-white transition focus-ring" />
            </div>

            <div>
              <label for="confirmPassword" class="block text-xs font-semibold text-ink/70 mb-1.5">Confirm password</label>
              <input id="confirmPassword" type="password" required placeholder="Repeat your password"
                class="w-full text-sm bg-paper2 border border-teal/15 rounded-xl px-4 py-3 placeholder:text-ink/35 focus:border-teal focus:bg-white transition focus-ring" />
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-teal hover:bg-teal-dark transition text-white text-sm font-semibold rounded-xl py-3.5 focus-ring">
              Create Account
            </button>
          </form>

          <p class="text-center text-sm text-ink/60 mt-7">
            Already have an account?
            <a href="/login" class="font-semibold text-teal hover:text-teal-dark focus-ring rounded">Login</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const tabs = document.querySelectorAll('.role-tab');
    const registerForm = document.getElementById('register-form');
    const registerError = document.getElementById('register-error');
    const registerSuccess = document.getElementById('register-success');
    const submitBtn = document.getElementById('submit-btn');
    let selectedRole = 'customer';

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        selectedRole = tab.dataset.role;
        tabs.forEach((t) => {
          const active = t.dataset.role === selectedRole;
          t.dataset.active = active;
          t.setAttribute('aria-selected', active);
        });

        registerForm.reset();
        registerError.classList.add('hidden');
        registerSuccess.classList.add('hidden');
      });
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      registerError.classList.add('hidden');
      registerSuccess.classList.add('hidden');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        registerError.textContent = 'Passwords do not match.';
        registerError.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      const originalLabel = submitBtn.textContent;
      submitBtn.textContent = 'Creating account…';

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role: selectedRole }),
        });

        const data = await res.json();

        if (!res.ok) {
          registerError.textContent = data.error || 'Could not create account.';
          registerError.classList.remove('hidden');
          return;
        }

        registerSuccess.textContent = 'Account created successfully. Redirecting to your dashboard...';
        registerSuccess.classList.remove('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Account created';

        const destination = data.user?.role === 'retailer'
          ? '/retailer-dashboard'
          : data.user?.role === 'admin'
            ? '/admin-dashboard'
            : '/dashboard';

        setTimeout(() => {
          window.location.href = destination;
        }, 1200);
      } catch (err) {
        registerError.textContent = 'Network error — please try again.';
        registerError.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
      }
    });
  </script>
</body>
</html>
